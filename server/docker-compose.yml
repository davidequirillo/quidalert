# Docker compose file for development mode.
# For production, we will use a different Docker compose file (docker-compose.prod.yml), 
# or we will use a different deployment method (like Kubernetes, Docker Swarm, etc.)
name: quidalert-dev
services:
  # --- FastAPI Backend ---
  fastapi:
    build:
      context: ./api_backend
      dockerfile: Dockerfile
    container_name: fastapi_backend_dev
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./api_backend:/app  # Only for development. Important: do not use this for production!
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    networks:
      - serverside-net
    depends_on:
      - postgres
      - redis
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - minio
      - mailpit
  
  # --- Relational DBMS ---
  postgres:
    image: postgres:17-alpine
    container_name: postgres_dbms_dev
    restart: always
    environment:
      # If variables are not found in .env, use defaults after :-
      POSTGRES_USER: ${DB_USER:-dbuser}
      POSTGRES_PASSWORD: ${DB_PASS:-dbpass}
      POSTGRES_DB: ${DB_NAME:-quidalert_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - serverside-net

  # --- DBMS for speedy operations (Redis single) ---
  redis:
    image: redis:7-alpine
    container_name: redis_cache_dev
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - serverside-net

  # --- DBMS for speedy operations (Redis cluster) ---
  redis-node-1:
    image: redis:7-alpine
    container_name: redis_node_1_dev
    volumes:
      - redis-data-1:/data
    command: redis-server --port 7001 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --bind 0.0.0.0 --cluster-announce-ip redis-node-1 --cluster-announce-port 7001 --cluster-announce-bus-port 17001
    ports:
      - "7001:7001"
      - "17001:17001"
    networks:
      - serverside-net

  redis-node-2:
    image: redis:7-alpine
    container_name: redis_node_2_dev
    volumes:
      - redis-data-2:/data
    command: redis-server --port 7002 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --bind 0.0.0.0 --cluster-announce-ip redis-node-2 --cluster-announce-port 7002 --cluster-announce-bus-port 17002
    ports:
      - "7002:7002"
      - "17002:17002"
    networks:
      - serverside-net

  redis-node-3:
    image: redis:7-alpine
    container_name: redis_node_3_dev
    volumes:
      - redis-data-3:/data
    command: redis-server --port 7003 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --bind 0.0.0.0 --cluster-announce-ip redis-node-3 --cluster-announce-port 7003 --cluster-announce-bus-port 17003
    ports:
      - "7003:7003"
      - "17003:17003"
    networks:
      - serverside-net

  # --- STORAGE for uploads (s3 compatible) ---
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: minio_storage_dev
    restart: always
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Web console port
    environment:
      MINIO_ROOT_USER: ${S3_USER:-s3user}
      MINIO_ROOT_PASSWORD: ${S3_PASS:-s3pass}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - serverside-net

  # --- SERVER SMTP for testing (MAILPIT) ---
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: mailpit_server_dev
    restart: always
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web console port
    volumes:
      - mailpit_data:/data
    networks:
      - serverside-net
      
# Volumes definition
volumes:
  postgres_data:
  redis_data:
  redis-data-1:
  redis-data-2:
  redis-data-3:
  minio_data:
  mailpit_data:

# Networks definition
networks:
  serverside-net:
    driver: bridge
