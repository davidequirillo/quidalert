# Docker compose file for production mode.
# This is the production version, which uses a reverse proxy (Caddy)

## Common configuration for logging
x-logging-config: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

## Name of the Docker Compose project
name: quidalert-prod

## Services configuration
services:
  # --- BACKEND FASTAPI ---
  fastapi:
    build:
      context: ./api_backend
      dockerfile: Dockerfile.prod
    container_name: fastapi_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    networks:
      - serverside-net
    depends_on:
      postgres:
        condition: service_started
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
      minio:
        condition: service_started
    logging: *default-logging
      
  # --- POSTGRESQL DBMS ---
  postgres:
    image: postgres:17-alpine
    container_name: postgres_dbms
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - serverside-net
    logging: *default-logging

  # --- REDIS CLUSTER (3 NODES) ---
  redis-node-1:
    image: redis:7-alpine
    container_name: redis_node_1
    restart: unless-stopped
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --requirepass ${REDIS_PASS}
      --masterauth ${REDIS_PASS}
      --cluster-announce-hostname redis-node-1
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
      --cluster-preferred-endpoint-type hostname
    volumes:
      - redis_node_1_data:/data
    networks:
      - serverside-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "-p", "6379", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  redis-node-2:
    image: redis:7-alpine
    container_name: redis_node_2
    restart: unless-stopped
    command: >
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --requirepass ${REDIS_PASS}
      --masterauth ${REDIS_PASS}
      --cluster-announce-hostname redis-node-2
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
      --cluster-preferred-endpoint-type hostname
    volumes:
      - redis_node_2_data:/data
    networks:
      - serverside-net
    depends_on:
      redis-node-1:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "-p", "6379", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
  
  redis-node-3:
    image: redis:7-alpine
    container_name: redis_node_3
    restart: unless-stopped
    command: > 
      redis-server
      --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --requirepass ${REDIS_PASS}
      --masterauth ${REDIS_PASS}
      --cluster-announce-hostname redis-node-3
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
      --cluster-preferred-endpoint-type hostname
    volumes:
      - redis_node_3_data:/data
    networks:
      - serverside-net
    depends_on:
      redis-node-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS}", "-p", "6379", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  # --- STORAGE for uploads (s3 compatible) ---
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: minio_storage
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_USER}
      MINIO_ROOT_PASSWORD: ${S3_PASS}
    ports:
      # We map port 9001 of the host (only loopback interface) to port 9001 of the container (MinIO web console)
      # This way, the MinIO web console is accessible only from the host machine (localhost interface), and not from the outside world.
      # So, to access it from outside, you need to do SSH tunneling.
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - serverside-net
    logging: *default-logging

  # --- REVERSE PROXY HTTPS (CADDY) ---
  caddy:
    image: caddy:2-alpine
    container_name: caddy_rev_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SERVER_NAME: ${SERVER_NAME}
    volumes:     
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - serverside-net
    depends_on:
      - fastapi
    logging: *default-logging

## Volume definitions (for persistent data storage)
volumes:
  postgres_data:
  redis_node_1_data:
  redis_node_2_data:
  redis_node_3_data:
  minio_data:
  caddy_data:
  caddy_config:

## Network definitions (internal network for containers)
networks:
  serverside-net:
    driver: bridge
