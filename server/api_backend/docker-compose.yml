# Docker compose file (this is only for development)
# For production, we will use a different deployment method (like Kubernetes or Docker Swarm)
services:
  # --- FastAPI Backend ---
  fastapi:
    build: .
    container_name: fastapi_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - .:/app  # Only for development. Important: do not use this for production!
    env_file:
      - .env    # Load all variables from .env file
    environment:
      # Override hosts to point to Docker container names
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379/0
      REDIS_CLUSTER_NODES: redis-node-1:7001,redis-node-2:7002,redis-node-3:7003
      S3_ENDPOINT: http://minio:9000
    networks:
      - redis-cluster-net
    depends_on:
      - postgres
      - redis
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - minio
      - mailpit
  
  # --- Relational DBMS ---
  postgres:
    image: postgres:17-alpine
    container_name: postgres_dbms
    restart: always
    environment:
      # If variables are not found in .env, use defaults after :-
      POSTGRES_USER: ${DB_USER:-dbuser}
      POSTGRES_PASSWORD: ${DB_PASS:-dbpass}
      POSTGRES_DB: ${DB_NAME:-quidalert_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - redis-cluster-net

  # --- DBMS for speedy operations (Redis single) ---
  redis:
    image: redis:7.4-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - redis-cluster-net

  # --- DBMS for speedy operations (Redis cluster) ---
  redis-node-1:
    image: redis:7.4-alpine
    container_name: redis-node-1
    volumes:
      - redis-data-1:/data
    command: redis-server --port 7001 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --bind 0.0.0.0 --cluster-announce-ip redis-node-1 --cluster-announce-port 7001 --cluster-announce-bus-port 17001
    ports:
      - "7001:7001"
      - "17001:17001"
    networks:
      - redis-cluster-net

  redis-node-2:
    image: redis:7.4-alpine
    container_name: redis-node-2
    volumes:
      - redis-data-2:/data
    command: redis-server --port 7002 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --bind 0.0.0.0 --cluster-announce-ip redis-node-2 --cluster-announce-port 7002 --cluster-announce-bus-port 17002
    ports:
      - "7002:7002"
      - "17002:17002"
    networks:
      - redis-cluster-net

  redis-node-3:
    image: redis:7.4-alpine
    container_name: redis-node-3
    volumes:
      - redis-data-3:/data
    command: redis-server --port 7003 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --bind 0.0.0.0 --cluster-announce-ip redis-node-3 --cluster-announce-port 7003 --cluster-announce-bus-port 17003
    ports:
      - "7003:7003"
      - "17003:17003"
    networks:
      - redis-cluster-net

  # --- STORAGE for uploads (s3 compatible) ---
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: minio_storage
    restart: always
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Web console port
    environment:
      MINIO_ROOT_USER: ${S3_USER:-s3user}
      MINIO_ROOT_PASSWORD: ${S3_PASS:-s3pass}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - redis-cluster-net

  # --- SERVER SMTP for testing (MAILPIT) ---
  mailpit:
    image: axllent/mailpit:v1.28.4
    container_name: mailpit_server
    restart: always
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web console port
    volumes:
      - mailpit_data:/data
    networks:
      - redis-cluster-net
      
# Volumes definition
volumes:
  postgres_data:
  redis_data:
  redis-data-1:
  redis-data-2:
  redis-data-3:
  minio_data:
  mailpit_data:

# Networks definition
networks:
  redis-cluster-net:
    driver: bridge