services:
  # --- Relational DBMS ---
  db:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: always
    environment:
      # If variables are not found in .env, use defaults after :-
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-password123}
      POSTGRES_DB: ${DB_NAME:-quidalert_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # --- DBMS for speedy operations
  redis:
    image: redis:7.4-alpine
    container_name: redis_cache
    restart: always
    ports:
      - "6379:6379"
    # at the moment we don't use persistence in Redis

  # --- STORAGE for uploads (s3 compatible) ---
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: minio_storage
    restart: always
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Web console port
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASS:-password123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

# --- SERVER SMTP for testing (MAILPIT) ---
  mailpit:
    image: axllent/mailpit:v1.28.4
    container_name: mail_server
    restart: always
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web console port

# Volumes definition
volumes:
  postgres_data:
  minio_data: